server:
  port: 9000

spring:
  application:
    ## 注册服务名
    name: yy-data-admin

management:
  endpoint:
    health:
      show-details: always

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lengye.yy.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
---
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 开启 publisher confirm
    publisher-confirm-type: correlated
    # 可选开启 publisher returns
    # publisher-returns: true
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.example: DEBUG
    org.springframework.amqp: INFO